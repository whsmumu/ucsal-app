<ion-side-menus enable-menu-with-back-views="false">

  <!-- Área de conteúdo: as telas abrem na ion-nav-view "menuContent" -->
  <ion-side-menu-content>
    <ion-nav-bar class="bar-ucsal">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <!-- Menu lateral (fica fixo em telas grandes) -->
  <ion-side-menu side="left" expose-aside-when="large" class="menu-ucsal">
    <ion-header-bar class="bar-ucsal">
      <h1 class="title marca"><span class="marca-logo">U</span> ucsal <small>portal</small></h1>
    </ion-header-bar>

    <ion-content>
      <div class="list menu-lista">
        <a class="item item-icon-left" menu-close ui-sref="app.noticias" ui-sref-active="ativo">
          <i class="icon ion-ios-paper-outline"></i> Mural
        </a>
        <a class="item item-icon-left" menu-close ui-sref="app.perfil" ui-sref-active="ativo">
          <i class="icon ion-ios-person-outline"></i> Meu cadastro
        </a>
        <a class="item item-icon-left" menu-close ui-sref="app.financeiro" ui-sref-active="ativo">
          <i class="icon ion-card"></i> Financeiro
        </a>
      </div>

      <div class="menu-aluno">
        <div class="avatar">{{aluno.nome.charAt(0)}}</div>
        <div>
          <strong>{{aluno.nome}}</strong>
          <p>{{aluno.matricula}}</p>
        </div>
      </div>

      <button class="button button-block botao-primario botao-sair" menu-close ng-click="sair()">
        <i class="icon ion-log-out"></i> Sair
      </button>
    </ion-content>
  </ion-side-menu>

</ion-side-menus>
